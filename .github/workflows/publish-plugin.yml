name: publish-plugin

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    publish-plugin:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check Windy publishing key
              env:
                  WINDY_API_KEY: '${{ secrets.WINDY_API_KEY }}'
              run: |
                  if [ -z "$WINDY_API_KEY" ]; then
                    echo "::error::WINDY_API_KEY is missing. Create a Windy Plugins API key at https://api.windy.com/keys and add it as a repository Actions secret named WINDY_API_KEY."
                    exit 1
                  fi
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
            - name: Build
              run: |
                  npm ci
                  npm run build
            - name: Publish Plugin
              env:
                  WINDY_API_KEY: '${{ secrets.WINDY_API_KEY }}'
              run: |
                  cd dist
                  echo "Creating plugin archive..."
                  echo "{\"repositoryName\": \"${{ github.repository }}\", \"commitSha\": \"${{ github.sha }}\", \"repositoryOwner\": \"${{ github.repository_owner }}\"}" > /tmp/plugin-info.json
                  mv plugin.json /tmp
                  jq -s '.[0] * .[1]' /tmp/plugin.json /tmp/plugin-info.json > plugin.json
                  tar cf ../plugin.tar .
                  echo "Publishing plugin..."
                  curl -s --fail-with-body -XPOST 'https://node.windy.com/plugins/v1.0/upload' -H "x-windy-api-key: ${WINDY_API_KEY}" -F "plugin_archive=@../plugin.tar"
